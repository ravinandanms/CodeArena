services:
  # Backend Web Service on Render
  - type: web
    name: codearena-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ONLINECOMPILER_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false

  # Frontend Static Site on Render
  - type: web
    name: codearena-frontend
    runtime: static
    rootDir: Frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
